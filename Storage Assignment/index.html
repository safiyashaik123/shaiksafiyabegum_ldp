<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local & Session Storage Counter</title>
    <!---<link rel="stylesheet" href="style.css">-->
</head>
<body>

    <div class="container">
        <h1>Storage Counter</h1>

        <div class="score-box">
            <h2>Local Score</h2>
            <p id="localScore">0</p>
        </div>

        <div class="score-box">
            <h2>Session Score</h2>
            <p id="sessionScore">0</p>
        </div>

        <button onclick="incrementScore()">
            Increment Score
        </button>
    </div>

    <script src="script.js"></script>

</body>
</html>
