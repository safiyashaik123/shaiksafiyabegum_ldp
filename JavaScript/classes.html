<!DOCTYPE html>
<html>
<body>

<script>

class Student {

    constructor(name, age, course) {

        this.name = name;
        this.age = age;
        this.course = course;

    }

    display() {

        console.log("Name :", this.name);

        console.log("Age :", this.age);

        console.log("Course :", this.course);

    }

}

let student1 = new Student("Safiya",21,"JavaScript");

let student2 = new Student("John",22,"Python");

student1.display();

student2.display();

</script>

</body>
</html>
