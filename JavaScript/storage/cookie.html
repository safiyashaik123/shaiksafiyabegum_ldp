<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Example</title>
</head>
<body>

    <h2>JavaScript Cookie Example</h2>

    <button onclick="setCookie()">Set Cookie</button>
    <button onclick="getCookie()">Get Cookie</button>
    <button onclick="updateCookie()">Update Cookie</button>
    <button onclick="deleteCookie()">Delete Cookie</button>

    <h3 id="output"></h3>

    <script>

    
        function setCookie() {
            document.cookie = "username=Safiya";
            document.cookie = "city=Mumbai";
            document.cookie = "theme=dark";
            document.getElementById("output").innerHTML =
                "Cookie Created Successfully!";
        }

    
        function getCookie() {
            document.getElementById("output").innerHTML =
                document.cookie;
        }

        
        function updateCookie() {
            document.cookie = "username=Sara";
            document.getElementById("output").innerHTML =
                "Cookie Updated!";
        }

        
        function deleteCookie() {
            document.cookie =
                "username=; expires=Thu, 01 Jan 1970 00:00:00 UTC";

            document.getElementById("output").innerHTML =
                "Cookie Deleted!";
        }

    </script>

</body>
</html>
