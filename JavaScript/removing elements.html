<!DOCTYPE html>
<html>
<body>

<h1>Removing Elements</h1>

<div id="container">

    <p id="p1">Apple</p>
    <p id="p2">Banana</p>
    <p id="p3">Orange</p>

</div>

<button onclick="removeElements()">Remove</button>

<script>

function removeElements(){


    document.getElementById("p1").remove();


    document.getElementById("p2").remove();

}

</script>

</body>
</html>
